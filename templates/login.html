{% extends "base.html" %}
{% block title %}Log in | Cyclone Tickets{% endblock %}
{% block content %}
<div class="container py-5"><div class="col-md-6 col-lg-4 mx-auto panel">
    <h2 class="fw-bold mb-3">Log in</h2>
    <form method="post">
        <div class="mb-3"><label class="form-label">Email</label><input type="email" name="email" class="form-control" required autofocus></div>
        <div class="mb-3"><label class="form-label">Password</label><input type="password" name="password" class="form-control" required></div>
        <button class="btn btn-cardinal w-100">Log in</button>
    </form>
    <p class="small text-center mt-3 mb-0">New here? <a href="{{ url_for('signup', next=request.args.get('next')) }}">Create an account</a></p>
</div></div>
{% endblock %}
