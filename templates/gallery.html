{% extends "base.html" %}
{% block title %}Gallery{% endblock %}
{% block content %}
<section class="ss-page-header ss-hot text-white py-5 position-relative">
    <div class="container position-relative" style="z-index: 1;">
        <h1 class="display-5 fw-bold mb-2">Past jobs</h1>
        <p class="lead mb-0 opacity-90">A few yards we’ve left smoother and sparklier. Photos from our crew and happy customers.</p>
    </div>
</section>

<section class="ss-floral py-5">
    <div class="container">
        <p class="text-muted small text-center mb-4">Stock photos for demo—replace with your real job photos anytime.</p>
        <div class="row g-4">
            <div class="col-md-6 col-lg-4">
                <figure class="card border-0 shadow-sm overflow-hidden ss-gallery-card mb-0">
                    <img src="https://images.unsplash.com/photo-1502082553048-f009c37129b9?w=800&q=80" class="card-img-top ss-gallery-img" alt="Tree stump in a green lawn before grinding">
                    <figcaption class="card-body py-3">
                        <span class="badge ss-badge-hot mb-1">Before</span>
                        <p class="small mb-0 text-muted">Oak stump, side yard—standard grind to 8&quot; below grade.</p>
                    </figcaption>
                </figure>
            </div>
            <div class="col-md-6 col-lg-4">
                <figure class="card border-0 shadow-sm overflow-hidden ss-gallery-card mb-0">
                    <img src="https://images.unsplash.com/photo-1416879595882-3373a0480b5b?w=800&q=80" class="card-img-top ss-gallery-img" alt="Fresh mulch and soil where a stump was removed">
                    <figcaption class="card-body py-3">
                        <span class="badge bg-secondary mb-1">After</span>
                        <p class="small mb-0 text-muted">Chips leveled; customer top-dressed for seed.</p>
                    </figcaption>
                </figure>
            </div>
            <div class="col-md-6 col-lg-4">
                <figure class="card border-0 shadow-sm overflow-hidden ss-gallery-card mb-0">
                    <img src="https://images.unsplash.com/photo-1542273917363-3b1817f69a2d?w=800&q=80" class="card-img-top ss-gallery-img" alt="Rows of trees in a landscaped area">
                    <figcaption class="card-body py-3">
                        <span class="badge ss-badge-hot mb-1">Commercial</span>
                        <p class="small mb-0 text-muted">HOA perimeter—four stumps, one morning.</p>
                    </figcaption>
                </figure>
            </div>
            <div class="col-md-6 col-lg-4">
                <figure class="card border-0 shadow-sm overflow-hidden ss-gallery-card mb-0">
                    <img src="https://images.unsplash.com/photo-1513836279014-a89f7a76ae86?w=800&q=80" class="card-img-top ss-gallery-img" alt="Backyard lawn and garden">
                    <figcaption class="card-body py-3">
                        <span class="badge ss-badge-hot mb-1">Tight access</span>
                        <p class="small mb-0 text-muted">36&quot; gate; we used the compact unit and plywood runs.</p>
                    </figcaption>
                </figure>
            </div>
            <div class="col-md-6 col-lg-4">
                <figure class="card border-0 shadow-sm overflow-hidden ss-gallery-card mb-0">
                    <img src="https://images.unsplash.com/photo-1464226184884-fa280b87c399?w=800&q=80" class="card-img-top ss-gallery-img" alt="Garden with flowers and trees">
                    <figcaption class="card-body py-3">
                        <span class="badge bg-secondary mb-1">Replant prep</span>
                        <p class="small mb-0 text-muted">Deep grind for a new ornamental—soil tested, roots cleared.</p>
                    </figcaption>
                </figure>
            </div>
            <div class="col-md-6 col-lg-4">
                <figure class="card border-0 shadow-sm overflow-hidden ss-gallery-card mb-0">
                    <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=800&q=80" class="card-img-top ss-gallery-img" alt="Sunlight through forest trees">
                    <figcaption class="card-body py-3">
                        <span class="badge ss-badge-hot mb-1">Storm follow-up</span>
                        <p class="small mb-0 text-muted">Lightning-damaged maple—hazard stump removed same week.</p>
                    </figcaption>
                </figure>
            </div>
        </div>
    </div>
</section>
{% endblock %}
