{% extends "base.html" %}
{% block title %}Sign up | Cyclone Tickets{% endblock %}
{% block content %}
<div class="container py-5"><div class="col-md-6 col-lg-4 mx-auto panel">
    <h2 class="fw-bold mb-3">Create your account</h2>
    <form method="post">
        <div class="mb-3"><label class="form-label">Full name</label><input name="name" class="form-control" required autofocus></div>
        <div class="mb-3"><label class="form-label">Email</label><input type="email" name="email" class="form-control" required></div>
        <div class="mb-3"><label class="form-label">Password</label><input type="password" name="password" class="form-control" minlength="6" required></div>
        <button class="btn btn-gold w-100">Sign up</button>
    </form>
    <p class="small text-center mt-3 mb-0">Already have an account? <a href="{{ url_for('login', next=request.args.get('next')) }}">Log in</a></p>
</div></div>
{% endblock %}
